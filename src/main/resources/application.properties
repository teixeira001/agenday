# ===============================================
# Configurações do Servidor
# ===============================================
server.port=8080
spring.application.name=agenday

# ===============================================
# Configurações do Banco de Dados PostgreSQL
# ===============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/agenday
spring.datasource.username=postgres
spring.datasource.password=trixti@!
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenciais da terapeuta (podem ser sobrescritas por variáveis de ambiente)
agenday.admin.username=${AGENDAY_ADMIN_USERNAME:admin}
agenday.admin.password=${AGENDAY_ADMIN_PASSWORD:admin123}

# ===============================================
# Configurações do Spring Data JPA / Hibernate
# ===============================================
# update: cria e atualiza tabelas automaticamente conforme as entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===============================================
# Configurações do Thymeleaf (Frontend)
# ===============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
