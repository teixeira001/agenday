# ===============================================
# Configurações do Servidor
# ===============================================
server.port=8080
spring.application.name=agenday

# ===============================================
# Configurações do Banco de Dados PostgreSQL
# ===============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/agenday
spring.datasource.username=postgres
# A senha pode ser informada aqui ou via variável de ambiente DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# Configurações do Spring Data JPA / Hibernate
# ===============================================
# update: cria e atualiza tabelas automaticamente conforme as entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===============================================
# Configurações do Thymeleaf (Frontend)
# ===============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
