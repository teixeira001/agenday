<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenday - Agendamento de Sessões</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-calendar-check me-2"></i>Agenday
            </a>
            <span class="navbar-text text-white-50 fs-6">Massoterapia</span>
        </div>
    </nav>

    <!-- Conteúdo Principal Mobile-First -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 text-center p-4">
                    <div class="card-body">
                        <div class="mb-3 text-primary">
                            <i class="bi bi-heart-pulse fs-1"></i>
                        </div>
                        <h1 class="card-title h3 fw-bold mb-3">Agende sua Sessão</h1>
                        <p class="card-text text-muted mb-4">
                            Escolha o melhor serviço e horário disponível para você em menos de 1 minuto.
                        </p>

                        <div class="d-grid gap-2 mb-4">
                            <a th:href="@{/agendamento}" class="btn btn-primary btn-lg rounded-pill shadow-sm">
                                <i class="bi bi-clock me-1"></i> Agendar Horário Agora
                            </a>
                        </div>

                        <hr class="my-4">

                        <div class="alert alert-success d-flex align-items-center justify-content-center m-0 py-2 rounded-3" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <small class="fw-medium">Projeto Spring Boot 3 + PostgreSQL inicializado!</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
