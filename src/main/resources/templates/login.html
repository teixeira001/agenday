<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Agenday</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card border-0 shadow-sm rounded-4 w-100" style="max-width: 420px">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold mb-1">Acesso profissional</h1>
            <p class="text-secondary mb-4">Entre para gerenciar sua agenda.</p>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Usuário ou senha inválidos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="status">
                Você saiu do sistema.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <a th:href="@{/}" class="d-block text-center mt-3 small">Voltar ao site</a>
        </div>
    </div>
</main>
</body>
</html>
