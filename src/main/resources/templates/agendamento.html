<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenday - Reservar Horário</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .service-card {
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 2px solid #e9ecef;
        }
        .service-card:hover {
            border-color: #0d6efd;
            background-color: #f8f9ff;
        }
        .service-card.selected {
            border-color: #0d6efd;
            background-color: #e7f1ff;
        }
        .time-pill {
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            font-weight: 500;
        }
        .time-pill.selected {
            background-color: #0d6efd !important;
            color: #ffffff !important;
            border-color: #0d6efd !important;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Barra de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-calendar-check me-2"></i>Agenday
            </a>
            <span class="navbar-text text-white-50 fs-6">Massoterapia</span>
        </div>
    </nav>

    <!-- Formulário Mobile-First -->
    <main class="container my-4 my-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!-- Alerta de Erro de Concorrência/Disponibilidade -->
                <div th:if="${erroDisponibilidade}" class="alert alert-warning alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${erroDisponibilidade}">Erro de disponibilidade</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h1 class="h4 fw-bold text-dark mb-1">Reserve seu Horário</h1>
                        <p class="text-muted small mb-4">Preencha as etapas abaixo em menos de 1 minuto.</p>

                        <form th:action="@{/agendamento}" th:object="${agendamentoDTO}" method="POST" id="formAgendamento">

                            <!-- Etapa 1: Escolha do Serviço -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-uppercase text-secondary">
                                    <i class="bi bi-1-circle-fill text-primary me-1"></i> 1. Escolha o Serviço
                                </label>
                                <div class="vstack gap-2">
                                    <div th:each="serv : ${servicos}" class="card service-card p-3 rounded-3"
                                         th:classappend="${agendamentoDTO.servicoId == serv.id} ? 'selected' : ''"
                                         th:data-id="${serv.id}">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="mb-1 fw-bold text-dark" th:text="${serv.nome}">Nome do Serviço</h6>
                                                <p class="mb-1 small text-muted" th:text="${serv.descricao}">Descrição</p>
                                                <span class="badge bg-light text-primary border">
                                                    <i class="bi bi-clock me-1"></i><span th:text="${serv.duracaoMinutos}">60</span> min
                                                </span>
                                            </div>
                                            <div class="text-end">
                                                <span class="fs-5 fw-bold text-primary">
                                                    R$ <span th:text="${#numbers.formatDecimal(serv.valor, 1, 'POINT', 2, 'COMMA')}">120,00</span>
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <input type="hidden" th:field="*{servicoId}" id="servicoIdInput">
                                <div th:if="${#fields.hasErrors('servicoId')}" class="text-danger small mt-1" th:errors="*{servicoId}"></div>
                            </div>

                            <!-- Etapa 2: Escolha da Data -->
                            <div class="mb-4">
                                <label for="dataInput" class="form-label fw-bold small text-uppercase text-secondary">
                                    <i class="bi bi-2-circle-fill text-primary me-1"></i> 2. Escolha a Data
                                </label>
                                <input type="date" class="form-control form-control-lg rounded-3" id="dataInput"
                                       th:field="*{data}" th:min="${dataMinima}" required>
                                <div th:if="${#fields.hasErrors('data')}" class="text-danger small mt-1" th:errors="*{data}"></div>
                            </div>

                            <!-- Etapa 3: Seleção do Horário -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-uppercase text-secondary">
                                    <i class="bi bi-3-circle-fill text-primary me-1"></i> 3. Horários Disponíveis
                                </label>
                                <div id="containerHorarios" class="p-3 bg-white border rounded-3 text-center">
                                    <span class="text-muted small" id="mensagemPlaceholder">
                                        <i class="bi bi-info-circle me-1"></i> Selecione um serviço e uma data para ver os horários.
                                    </span>
                                    <div id="gridHorarios" class="d-flex flex-wrap gap-2 justify-content-center d-none">
                                        <!-- Os horários serão inseridos aqui dinamicamente via JavaScript -->
                                    </div>
                                    <div id="spinnerCarregando" class="spinner-border text-primary d-none my-2" role="status">
                                        <span class="visually-hidden">Carregando...</span>
                                    </div>
                                </div>
                                <input type="hidden" th:field="*{horario}" id="horarioInput">
                                <div th:if="${#fields.hasErrors('horario')}" class="text-danger small mt-1" th:errors="*{horario}"></div>
                            </div>

                            <!-- Etapa 4: Dados do Cliente -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-uppercase text-secondary">
                                    <i class="bi bi-4-circle-fill text-primary me-1"></i> 4. Seus Dados
                                </label>
                                <div class="mb-3">
                                    <label for="nomeCliente" class="form-label small text-muted">Seu Nome Completo</label>
                                    <input type="text" class="form-control rounded-3" id="nomeCliente"
                                           th:field="*{nomeCliente}" placeholder="Ex: Maria Oliveira" required>
                                    <div th:if="${#fields.hasErrors('nomeCliente')}" class="text-danger small mt-1" th:errors="*{nomeCliente}"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="telefoneCliente" class="form-label small text-muted">WhatsApp / Celular com DDD</label>
                                    <input type="tel" class="form-control rounded-3" id="telefoneCliente"
                                           th:field="*{telefoneCliente}" placeholder="Ex: (11) 98765-4321" required>
                                    <div th:if="${#fields.hasErrors('telefoneCliente')}" class="text-danger small mt-1" th:errors="*{telefoneCliente}"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="observacao" class="form-label small text-muted">Observação (Opcional)</label>
                                    <input type="text" class="form-control rounded-3" id="observacao"
                                           th:field="*{observacao}" placeholder="Ex: Foco em dores na lombar">
                                </div>
                            </div>

                            <!-- Botão de Confirmação -->
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm fw-bold" id="btnConfirmar">
                                    <i class="bi bi-check-circle me-1"></i> Confirmar Agendamento
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container text-center pb-4">
        <a th:href="@{/login}" class="text-secondary small text-decoration-none">Acesso profissional</a>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de Integração e Carregamento Dinâmico de Horários -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const serviceCards = document.querySelectorAll('.service-card');
            const servicoInput = document.getElementById('servicoIdInput');
            const dataInput = document.getElementById('dataInput');
            const horarioInput = document.getElementById('horarioInput');
            const gridHorarios = document.getElementById('gridHorarios');
            const spinner = document.getElementById('spinnerCarregando');
            const placeholder = document.getElementById('mensagemPlaceholder');

            // 1. Clique nos cards de serviço
            serviceCards.forEach(card => {
                card.addEventListener('click', function () {
                    serviceCards.forEach(c => c.classList.remove('selected'));
                    this.classList.add('selected');
                    servicoInput.value = this.getAttribute('data-id');
                    buscarHorariosDisponiveis();
                });
            });

            // 2. Mudança de data
            dataInput.addEventListener('change', buscarHorariosDisponiveis);

            // 3. Função que consulta o endpoint REST do Spring Boot
            function buscarHorariosDisponiveis() {
                const servicoId = servicoInput.value;
                const data = dataInput.value;

                if (!servicoId || !data) {
                    return;
                }

                // Exibe spinner
                placeholder.classList.add('d-none');
                gridHorarios.classList.add('d-none');
                gridHorarios.innerHTML = '';
                spinner.classList.remove('d-none');

                fetch(`/api/horarios-disponiveis?servicoId=${servicoId}&data=${data}`)
                    .then(response => {
                        if (!response.ok) throw new Error("Erro ao buscar horários");
                        return response.json();
                    })
                    .then(horarios => {
                        spinner.classList.add('d-none');

                        if (horarios.length === 0) {
                            placeholder.innerHTML = '<i class="bi bi-calendar-x text-warning me-1"></i> Nenhum horário disponível nesta data. Escolha outro dia.';
                            placeholder.classList.remove('d-none');
                            horarioInput.value = '';
                            return;
                        }

                        // Renderiza os botões (chips) para cada horário
                        horarios.forEach(h => {
                            const btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'btn btn-outline-primary btn-sm rounded-pill px-3 py-2 time-pill';
                            btn.innerText = h;

                            if (horarioInput.value === h) {
                                btn.classList.add('selected');
                            }

                            btn.addEventListener('click', function () {
                                document.querySelectorAll('.time-pill').forEach(p => p.classList.remove('selected'));
                                this.classList.add('selected');
                                horarioInput.value = h;
                            });

                            gridHorarios.appendChild(btn);
                        });

                        gridHorarios.classList.remove('d-none');
                    })
                    .catch(err => {
                        spinner.classList.add('d-none');
                        placeholder.innerHTML = '<i class="bi bi-x-circle text-danger me-1"></i> Não foi possível consultar os horários.';
                        placeholder.classList.remove('d-none');
                    });
            }

            // Se a página recarregar com erros e já tiver valores prévios
            if (servicoInput.value && dataInput.value) {
                buscarHorariosDisponiveis();
            }
        });
    </script>
</body>
</html>
